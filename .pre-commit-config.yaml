repos:
  - repo: https://github.com/python-poetry/poetry
    rev: "94b6e35b9091991887aa54feeb3771a86d3bd692" # frozen: 2.5.1
    hooks:
      - id: poetry-check
      - id: poetry-lock

  - repo: https://github.com/floatingpurr/sync_with_poetry
    rev: 41b6bf233c52f08f344e09107bdda253e6d8b57a # frozen: 1.1.0
    hooks:
      - id: sync_with_poetry
        pass_filenames: false
        files: ".pre-commit-config.yaml|poetry.lock"
        args: ["poetry.lock"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "fc260393cc4ec09f8fc0a5ba4437f481c8b55dc1" # frozen: v3.0.3
    hooks:
      - id: prettier

  - repo: https://github.com/rstcheck/rstcheck
    rev: "1fb8ceaa49b8492ad630d689fcf216c8a53c9542" # frozen: v6.2.4
    hooks:
      - id: rstcheck
        additional_dependencies: [sphinx]
        args: ["--config", "docs/rstcheck.cfg"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        description: Type checking with ty, run in the project's poetry environment.
        entry: poetry run ty check
        language: system
        types: [python]
        pass_filenames: false
